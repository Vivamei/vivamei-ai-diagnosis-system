# web 镜像内 nginx 的 conf.d 覆盖文件（挂载到 /etc/nginx/conf.d/default.conf）。
# 作用：TLS 终止 + SPA 静态托管 + /api 反向代理 + SSE 流式透传。
# 静态文件已在镜像里烤进 /usr/share/nginx/html。

upstream api {
    server api:8000;
}

# HTTP：放行 ACME 校验，其余强跳 HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    client_max_body_size 6m;

    # 静态资源 + SPA fallback
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;

        location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location = /index.html {
            add_header Cache-Control "no-store";
        }
    }

    location /legal/ {
        root /usr/share/nginx/html;
    }

    # SSE 流式（analyze/*/stream）：关 buffering，延长读超时
    location ~ ^/api/analyze/.+/stream$ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 旧版客户端的 WebSocket 兼容入口。当前 H5 与小程序均走上面的 SSE /stream，
    # 本规则保留给尚未升级的旧客户端。
    location ~ ^/api/analyze/.+/ws$ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://api;
    }
}
