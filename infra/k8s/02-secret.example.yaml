# ============================================
# 仅作为模板说明，真实 Secret 不要提交到仓库
#
# 推荐用 envfile 一条命令导入（不会留下明文 YAML）：
#
#   kubectl -n venus-prod create secret generic api-secret \
#       --from-env-file=/tmp/.env.prod
#
# /tmp/.env.prod 参考 infra/.env.example
#
# 更安全：用阿里云 KMS + ack-secret-manager，秘钥不落 etcd
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: venus-prod
type: Opaque
stringData:
  DATABASE_URL: "mysql+aiomysql://venus:CHANGE_ME@rm-xxxxx.mysql.rds.aliyuncs.com:3306/venus"
  REDIS_URL: "redis://:CHANGE_ME@r-xxxxx.redis.rds.aliyuncs.com:6379/0"
  JWT_SECRET: "CHANGE_ME"
  PHONE_DEK_BASE64: "CHANGE_ME"
  PHONE_HMAC_KEY: "CHANGE_ME"
  ALI_ACCESS_KEY_ID: "LTAI5tCHANGE_ME"
  ALI_ACCESS_KEY_SECRET: "CHANGE_ME"
  OSS_STS_ROLE_ARN: "acs:ram::CHANGE_ME:role/venus-oss-sts"
