[tool.poetry]
name = "venus-api"
version = "0.1.0"
description = "Yimei 4S H5 backend"
authors = ["venus <dev@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.32"}
pydantic = "^2.9"
pydantic-settings = "^2.6"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
aiomysql = "^0.2"
alembic = "^1.13"
redis = "^5.2"
fakeredis = "^2.26"
loguru = "^0.7"
python-jose = {extras = ["cryptography"], version = "^3.3"}
cryptography = "^43.0"
httpx = "^0.27"
ulid-py = "^1.1"
oss2 = "^2.18"
alibabacloud-green20220302 = "^2.0"
alibabacloud-dysmsapi20170525 = "^3.0"
python-multipart = "^0.0.32"
alibabacloud-sts20150401 = "^1.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^5.0"
ruff = "^0.7"
mypy = "^1.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
